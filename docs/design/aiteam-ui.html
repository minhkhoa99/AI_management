<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Team – giao diện mẫu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#080D1A}
a{color:#7FB0FF}a:hover{color:#A9C9FF}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;transition:background-color .15s,border-color .15s,color .15s}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #7FB0FF;outline-offset:2px}
input::placeholder{color:#7F8CA6}
.hov:hover{background:#1A2642 !important}
.pickbtn:focus-within{outline:2px solid #7FB0FF;outline-offset:2px}
.row:hover{background:#121C33 !important}
.cta:hover{background:#FB8A3C !important}
.pri:hover{background:#2F74E8 !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.otree ul{display:flex;justify-content:center;margin:0;padding:28px 0 0;position:relative;list-style:none}
.otree>ul{padding-top:0}
.otree li{position:relative;padding:28px 10px 0;display:flex;flex-direction:column;align-items:center}
.otree li::before,.otree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:28px;border-top:1px solid #3A4B75}
.otree li::after{right:auto;left:50%;border-left:1px solid #3A4B75}
.otree li:only-child{padding-top:0}
.otree li:only-child::before,.otree li:only-child::after{display:none}
.otree li:first-child::before,.otree li:last-child::after{border:0 none}
.otree li:last-child::before{border-right:1px solid #3A4B75;border-radius:0 10px 0 0}
.otree li:first-child::after{border-radius:10px 0 0 0}
.otree ul ul::before{content:"";position:absolute;top:0;left:50%;height:28px;border-left:1px solid #3A4B75}
.otree>ul>li{padding-top:0}
.otree>ul>li::before,.otree>ul>li::after{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="design-template">

<div style="min-height: 100vh; background: #080D1A; color: #E6ECF5; font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 14px; line-height: 1.55; display: flex; flex-wrap: wrap; align-items: stretch">

<nav aria-label="Điều hướng chính" style="flex: 1 1 248px; max-width: 100%; box-sizing: border-box; background: #0B1222; border-right: 1px solid #1E2A47; padding: 20px 14px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<span style="width: 34px; height: 34px; border-radius: 10px; background: #1D3A70; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9C9FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2h6v5H9zM2 17h6v5H2zM16 17h6v5h-6zM12 7v5M5 17v-3h14v3"></path></svg>
</span>
<span style="display: flex; flex-direction: column; line-height: 1.2">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px">Agent Org</span>
<span style="font-size: 12px; color: #9AA8C1">Không gian làm việc của bạn</span>
</span>
</div>

<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{ navs }}" as="n" hint-placeholder-count="4">
<button class="hov" onClick="{{ n.pick }}" aria-current="{{ n.current }}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; border: none; background: {{ n.bg }}; color: {{ n.fg }}; text-align: left; font-weight: 500">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.icon }}"></path></svg>
<span style="flex: 1">{{ n.label }}</span>
<span style="font-size: 12px; min-width: 22px; text-align: center; padding: 1px 7px; border-radius: 999px; background: {{ n.badgeBg }}; color: {{ n.badgeFg }}">{{ n.badge }}</span>
</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #9AA8C1; padding: 0 12px 6px">Phòng ban</span>
<sc-for list="{{ deptNav }}" as="d" hint-placeholder-count="3">
<button class="hov" onClick="{{ d.pick }}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 10px; border: none; background: transparent; text-align: left">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 2px; background: {{ d.color }}"></span>
<span style="flex: 1">{{ d.name }}</span>
<span style="font-size: 12px; color: #9AA8C1">{{ d.count }} agent</span>
</button>
</sc-for>
</div>

<div style="margin-top: auto; padding: 14px; border: 1px solid #1E2A47; border-radius: 14px; background: #0E172B; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 12px; color: #9AA8C1">Ngân sách hôm nay</span>
<span style="font-size: 12px; color: #C5D0E3">{{ budgetPct }}</span>
</div>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">{{ costTotal }} <span style="font-size: 13px; font-weight: 500; color: #9AA8C1">/ $20.00</span></span>
<div style="height: 6px; border-radius: 3px; background: #1E2A47; overflow: hidden"><div style="height: 6px; width: {{ budgetPct }}; background: #3B82F6"></div></div>
</div>
</nav>

<main style="flex: 999 1 600px; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 16px clamp(16px, 3vw, 32px); border-bottom: 1px solid #1E2A47; background: #0A1020">
<div style="display: flex; flex-direction: column; flex: 1 1 220px; min-width: 0">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">{{ screenTitle }}</h1>
<span style="font-size: 13px; color: #9AA8C1">{{ screenSub }}</span>
</div>
<label style="position: relative; flex: 1 1 260px; max-width: 380px; display: block">
<span class="sr">Tìm agent hoặc task</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA8C1" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 12px; top: 14px"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM20 20l-4-4"></path></svg>
<input type="search" value="{{ q }}" onInput="{{ setQ }}" placeholder="Tìm agent hoặc task" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 12px 0 38px; border-radius: 10px; border: 1px solid #24314F; background: #0E172B"></input>
</label>
<button class="hov" onClick="{{ goApprovals }}" aria-label="{{ bellAria }}" style="position: relative; width: 44px; height: 44px; border-radius: 10px; border: 1px solid #24314F; background: #0E172B; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"></path></svg>
<sc-if value="{{ hasApprovals }}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; border-radius: 9px; background: #F97316; color: #1A0A00; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ approvalCount }}</span></sc-if>
</button>
<button class="cta" onClick="{{ toggleRun }}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: none; background: #F97316; color: #1A0A00; font-weight: 600">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ runIcon }}"></path></svg>
{{ runLabel }}
</button>
<span aria-label="Tài khoản của bạn" style="width: 40px; height: 40px; border-radius: 20px; background: #2A2456; color: #CEC8FF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">BN</span>
</header>

<div style="padding: 22px clamp(16px, 3vw, 32px) 40px; display: flex; flex-direction: column; gap: 20px">

<sc-if value="{{ isOverview }}" hint-placeholder-val="{{ true }}">

<section aria-label="Chỉ số chính" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px">
<sc-for list="{{ kpis }}" as="k" hint-placeholder-count="4">
<div style="border: 1px solid #1E2A47; border-radius: 16px; background: #0E172B; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 13px; color: #9AA8C1">{{ k.label }}</span>
<span style="width: 32px; height: 32px; border-radius: 9px; background: {{ k.chipBg }}; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ k.chipFg }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ k.icon }}"></path></svg>
</span>
</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 10px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600; line-height: 1">{{ k.value }}</span>
<span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 3px; height: 30px">
<sc-for list="{{ k.spark }}" as="b" hint-placeholder-count="7"><span style="width: 5px; height: {{ b.h }}; border-radius: 2px; background: {{ b.c }}"></span></sc-for>
</span>
</div>
<span style="font-size: 12px; color: {{ k.trendFg }}">{{ k.trend }}</span>
</div>
</sc-for>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">
<section aria-label="Task theo giờ" style="flex: 2 1 460px; min-width: 0; border: 1px solid #1E2A47; border-radius: 16px; background: #0E172B; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center">
<div>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600">Task xử lý theo giờ</h2>
<span style="font-size: 12px; color: #9AA8C1">Hôm nay, tất cả phòng ban (dữ liệu mẫu)</span>
</div>
<div style="display: flex; gap: 14px; font-size: 12px; color: #C5D0E3">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #3B82F6"></span>Hoàn thành</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #F97316"></span>Lỗi, phải làm lại</span>
</div>
</div>
<div style="overflow-x: auto">
<div role="img" aria-label="{{ chartAria }}" style="min-width: 440px; display: flex; align-items: flex-end; gap: 8px; height: 170px; padding-top: 10px; border-bottom: 1px solid #24314F; background-image: linear-gradient(#1A2440 1px, transparent 1px); background-size: 100% 42px">
<sc-for list="{{ bars }}" as="b" hint-placeholder-count="12">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-size: 11px; color: #9AA8C1">{{ b.total }}</span>
<div style="width: 100%; max-width: 30px; height: {{ b.fail }}; background: #F97316; border-radius: 4px 4px 0 0"></div>
<div style="width: 100%; max-width: 30px; height: {{ b.done }}; background: #3B82F6; border-radius: {{ b.radius }}"></div>
</div>
</sc-for>
</div>
<div style="min-width: 440px; display: flex; gap: 8px; padding-top: 6px">
<sc-for list="{{ bars }}" as="b" hint-placeholder-count="12"><span style="flex: 1; text-align: center; font-size: 11px; color: #9AA8C1">{{ b.label }}</span></sc-for>
</div>
</div>
</section>

<section aria-label="Chi phí theo provider" style="flex: 1 1 280px; min-width: 0; border: 1px solid #1E2A47; border-radius: 16px; background: #0E172B; padding: 18px; display: flex; flex-direction: column; gap: 16px">
<div>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600">Chi phí theo bộ não</h2>
<span style="font-size: 12px; color: #9AA8C1">Hôm nay</span>
</div>
<div style="display: flex; align-items: center; gap: 18px; flex-wrap: wrap">
<div role="img" aria-label="{{ donutAria }}" style="width: 132px; height: 132px; border-radius: 66px; background: {{ donut }}; display: flex; align-items: center; justify-content: center; flex: none">
<div style="width: 88px; height: 88px; border-radius: 44px; background: #0E172B; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600">{{ costTotal }}</span>
<span style="font-size: 11px; color: #9AA8C1">tổng</span>
</div>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; flex: 1 1 120px">
<sc-for list="{{ provCost }}" as="p" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 8px; font-size: 13px">
<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: {{ p.color }}"></span>
<span style="flex: 1">{{ p.label }}</span>
<span style="color: #9AA8C1">{{ p.pct }}</span>
<span style="font-weight: 600; min-width: 46px; text-align: right">{{ p.amount }}</span>
</li>
</sc-for>
</ul>
</div>
</section>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<section aria-label="Danh sách agent" style="flex: 2 1 600px; min-width: 0; border: 1px solid #1E2A47; border-radius: 16px; background: #0E172B; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600">Agent ({{ tableCount }})</h2>
<div role="group" aria-label="Lọc theo phòng" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{ tableFilters }}" as="f" hint-placeholder-count="4">
<button onClick="{{ f.pick }}" aria-pressed="{{ f.pressed }}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{ f.border }}; background: {{ f.bg }}; font-size: 13px">{{ f.label }}</button>
</sc-for>
</div>
</div>
<sc-if value="{{ hasPicked }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 18px 12px; padding: 8px 12px; border-radius: 10px; background: #16305A; color: #DCE8FF">
<span style="font-weight: 500; flex: 1">Đã chọn {{ pickedCount }} agent</span>
<button class="hov" onClick="{{ bulkOn }}" style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #4A6FAF; background: transparent">Bật tất cả</button>
<button class="hov" onClick="{{ bulkOff }}" style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #4A6FAF; background: transparent">Tắt tất cả</button>
<button class="hov" onClick="{{ clearPicked }}" style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: none; background: transparent">Bỏ chọn</button>
</div>
</sc-if>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 820px; border-collapse: collapse; font-size: 13px">
<thead>
<tr style="text-align: left; color: #9AA8C1; font-size: 12px">
<th style="padding: 10px 0 10px 18px; font-weight: 500; width: 36px"><span class="sr">Chọn</span></th>
<th style="padding: 10px; font-weight: 500">Agent</th>
<th style="padding: 10px; font-weight: 500">Phòng</th>
<th style="padding: 10px; font-weight: 500">Bộ não</th>
<th style="padding: 10px; font-weight: 500">Trạng thái</th>
<th style="padding: 10px; font-weight: 500; text-align: right">Task xong</th>
<th style="padding: 10px; font-weight: 500">Thành công</th>
<th style="padding: 10px; font-weight: 500; text-align: right">Chi phí</th>
<th style="padding: 10px 18px 10px 10px; font-weight: 500; text-align: right">Bật</th>
</tr>
</thead>
<tbody>
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
<tr class="row" style="border-top: 1px solid #1A2440; background: {{ r.rowBg }}">
<td style="padding: 8px 0 8px 18px"><input type="checkbox" checked="{{ r.picked }}" onChange="{{ r.togglePick }}" aria-label="{{ r.pickAria }}" style="width: 18px; height: 18px; accent-color: #3B82F6"></input></td>
<td style="padding: 8px 10px">
<button onClick="{{ r.open }}" style="display: flex; align-items: center; gap: 10px; border: none; background: transparent; padding: 4px 0; text-align: left; min-height: 40px">
<span style="width: 34px; height: 34px; border-radius: 17px; background: {{ r.provBg }}; color: {{ r.provFg }}; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; flex: none">{{ r.initials }}</span>
<span style="display: flex; flex-direction: column; line-height: 1.3">
<span style="font-weight: 600; color: {{ r.nameColor }}">{{ r.name }}</span>
<span style="font-size: 12px; color: #9AA8C1">{{ r.role }}</span>
</span>
</button>
</td>
<td style="padding: 8px 10px; white-space: nowrap"><span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 2px; background: {{ r.deptColor }}"></span>{{ r.dept }}</span></td>
<td style="padding: 8px 10px"><span style="font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: {{ r.provBg }}; color: {{ r.provFg }}; white-space: nowrap">{{ r.prov }}</span><sc-if value="{{ r.hasModel }}" hint-placeholder-val="{{ false }}"><span style="display: block; margin-top: 4px; font-size: 11.5px; color: #9AA8C1; white-space: nowrap">{{ r.modelLine }}</span></sc-if></td>
<td style="padding: 8px 10px; white-space: nowrap"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: {{ r.stBg }}; color: {{ r.stFg }}"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 3px; background: {{ r.stDot }}"></span>{{ r.status }}</span></td>
<td style="padding: 8px 10px; text-align: right; font-variant-numeric: tabular-nums">{{ r.done }}</td>
<td style="padding: 8px 10px"><span style="display: flex; align-items: center; gap: 8px"><span style="width: 70px; height: 6px; border-radius: 3px; background: #1E2A47; overflow: hidden; display: inline-block"><span style="display: block; height: 6px; width: {{ r.rate }}; background: {{ r.rateColor }}"></span></span><span style="font-variant-numeric: tabular-nums">{{ r.rate }}</span></span></td>
<td style="padding: 8px 10px; text-align: right; font-variant-numeric: tabular-nums">{{ r.cost }}</td>
<td style="padding: 8px 18px 8px 10px; text-align: right">
<button class="hov" onClick="{{ r.toggle }}" aria-pressed="{{ r.onStr }}" aria-label="{{ r.toggleAria }}" style="min-width: 44px; min-height: 40px; border-radius: 8px; border: none; background: transparent; display: inline-flex; align-items: center; justify-content: center">
<span style="width: 30px; height: 18px; border-radius: 9px; background: {{ r.track }}; position: relative; display: inline-block"><span style="position: absolute; top: 2px; left: {{ r.knob }}; width: 14px; height: 14px; border-radius: 7px; background: #E6ECF5"></span></span>
</button>
</td>
</tr>
</sc-for>
</tbody>
</table>
<sc-if value="{{ rowsEmpty }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 20px 18px; color: #9AA8C1">Không có agent nào khớp “{{ q }}”. Thử từ khoá khác.</p></sc-if>
</div>
</section>

<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<section id="approvals" aria-label="Chờ duyệt" style="border: 1px solid #1E2A47; border-radius: 16px; background: #0E172B; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600">Chờ bạn duyệt</h2>
<span style="font-size: 12px; padding: 2px 10px; border-radius: 999px; background: #3A2010; color: #FDBA8C">{{ approvalCount }}</span>
</div>
<sc-for list="{{ approvals }}" as="a" hint-placeholder-count="3">
<div style="border: 1px solid #24314F; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 10px">
<span style="width: 30px; height: 30px; border-radius: 15px; background: {{ a.provBg }}; color: {{ a.provFg }}; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 11px; flex: none">{{ a.initials }}</span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px">{{ a.text }}</span>
<span style="font-size: 12px; color: #9AA8C1">{{ a.who }} · {{ a.dept }} · {{ a.ago }}</span>
</span>
</div>
<div style="display: flex; gap: 8px">
<button class="pri" onClick="{{ a.approve }}" style="flex: 1; min-height: 40px; border-radius: 8px; border: none; background: #3B82F6; color: #FFFFFF; font-weight: 600">Duyệt</button>

<sc-for list="{{ delegOpts }}" as="o" hint-placeholder-count="3"><option value="{{ o.id }}">{{ o.label }}</option></sc-for>
</select>
</label>
<button class="pri" onClick="{{ doDelegate }}" style="min-height: 42px; padding: 0 16px; border-radius: 10px; border: none; background: #3B82F6; color: #FFFFFF; font-weight: 600">Giao</button>
<button class="hov" onClick="{{ autoDelegate }}" style="min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid #33436A; background: transparent">Để {{ td.who }} tự giao</button>
</div>
</sc-if>
<sc-if value="{{ noDeleg }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #9AA8C1">{{ td.who }} không có cấp dưới đang bật nên tự thực hiện task này.</span></sc-if>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-if value="{{ tdHasDiff }}" hint-placeholder-val="{{ false }}"><button class="hov" onClick="{{ openDiff }}" style="min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid #33436A; background: transparent">Xem thay đổi code</button></sc-if>
<button class="hov" onClick="{{ editOpen }}" style="min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid #33436A; background: transparent">Sửa task</button>
<button class="hov" onClick="{{ delOpen }}" style="min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid #5A2A2A; background: transparent; color: #FCA5A5">Xoá task</button>
<button class="hov" onClick="{{ closeTask }}" style="min-height: 42px; padding: 0 14px; border-radius: 10px; border: none; background: transparent">Đóng</button>
</div>
</div>
<div style="flex: 2 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #C5D0E3; font-weight: 500">Nhật ký task</span>
<ol style="list-style: none; margin: 0; padding: 10px 12px; border-radius: 10px; background: #080D1A; border: 1px solid #1A2440; display: flex; flex-direction: column; gap: 8px; min-height: 120px">
<sc-for list="{{ taskLog }}" as="e" hint-placeholder-count="3">
<li style="display: flex; flex-direction: column; gap: 1px; font-size: 12.5px"><span><span style="font-weight: 600">{{ e.who }}</span> <span style="color: {{ e.color }}">{{ e.text }}</span></span><span style="font-size: 11.5px; color: #9AA8C1">{{ e.time }}</span></li>
</sc-for>
<sc-if value="{{ noTaskLog }}" hint-placeholder-val="{{ false }}"><li style="font-size: 12.5px; color: #9AA8C1">Chưa có hoạt động. Thử giao task xuống cấp dưới.</li></sc-if>
</ol>
</div>
</section>
</sc-if>

<section aria-label="Bảng task" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; align-items: start">
<sc-for list="{{ columns }}" as="c" hint-placeholder-count="4">
<div style="border: 1px solid #1E2A47; border-radius: 16px; background: #0B1324; padding: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 2px">
<span style="display: flex; align-items: center; gap: 8px; font-weight: 600"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: {{ c.color }}"></span>{{ c.label }}</span>
<span style="font-size: 12px; padding: 1px 9px; border-radius: 999px; background: #1E2A47; color: #C5D0E3">{{ c.count }}</span>
</div>
<sc-for list="{{ c.cards }}" as="t" hint-placeholder-count="3">
<article style="border: 1px solid {{ t.border }}; border-radius: 12px; background: {{ t.bg }}; padding: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: flex-start">
<button onClick="{{ t.open }}" aria-label="{{ t.openAria }}" style="border: none; background: transparent; padding: 0; text-align: left; font-weight: 600; font-size: 13.5px; min-height: 24px">{{ t.title }}</button>
<span style="font-size: 11px; padding: 1px 8px; border-radius: 999px; background: {{ t.prBg }}; color: {{ t.prFg }}; white-space: nowrap">{{ t.pr }}</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9AA8C1">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 2px; background: {{ t.deptColor }}"></span>{{ t.dept }} · {{ t.id }}
</div>
<span style="font-size: 11.5px; color: #9AA8C1; line-height: 1.45">{{ t.chain }}</span>
<span style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-if value="{{ t.hasDir }}" hint-placeholder-val="{{ true }}"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #16203A; color: #C5D0E3; font-family: ui-monospace, Menlo, Consolas, monospace; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ t.dirShort }}</span></sc-if>
<span style="font-size: 11px; padding: 2px 8px; border-radius: 999px; background: {{ t.qaBg }}; color: {{ t.qaFg }}; white-space: nowrap">{{ t.qaLabel }}</span>
</span>
<sc-if value="{{ t.cancelling }}" hint-placeholder-val="{{ false }}"><span role="status" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: #3A1414; color: #FCA5A5"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 3px; background: #F87171"></span>Đã gửi tín hiệu huỷ, chờ agent dừng…</span></sc-if>
<sc-if value="{{ t.live }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px">
<span style="width: 26px; height: 26px; border-radius: 13px; background: {{ t.provBg }}; color: {{ t.provFg }}; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 10px">{{ t.initials }}</span>{{ t.who }}
</span>
<span style="display: flex; gap: 4px">
<sc-if value="{{ t.canLeft }}" hint-placeholder-val="{{ true }}"><button class="hov" onClick="{{ t.left }}" aria-label="{{ t.leftAria }}" style="width: 32px; height: 32px; border-radius: 8px; border: 1px solid #33436A; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button></sc-if>
<sc-if value="{{ t.canRight }}" hint-placeholder-val="{{ true }}"><button class="hov" onClick="{{ t.right }}" aria-label="{{ t.rightAria }}" style="width: 32px; height: 32px; border-radius: 8px; border: 1px solid #33436A; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button></sc-if>
<button class="hov" onClick="{{ t.edit }}" aria-label="{{ t.editAria }}" style="width: 32px; height: 32px; border-radius: 8px; border: 1px solid #33436A; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"></path></svg></button>
<button class="hov" onClick="{{ t.del }}" aria-label="{{ t.delAria }}" style="width: 32px; height: 32px; border-radius: 8px; border: 1px solid #5A2A2A; background: transparent; color: #FCA5A5; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
</span>
</div>
</sc-if>
</article>
</sc-for>
<sc-if value="{{ c.empty }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 16px 6px; font-size: 13px; color: #9AA8C1; text-align: center">Không có task ở giai đoạn này.</p></sc-if>
</div>
</sc-for>
</section>
</sc-if>

<sc-if value="{{ isFlow }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div role="tablist" aria-label="Chọn phòng ban" style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #0E172B; border: 1px solid #1E2A47; flex-wrap: wrap">
<sc-for list="{{ deptTabs }}" as="t" hint-placeholder-count="3">
<button role="tab" aria-selected="{{ t.sel }}" onClick="{{ t.pick }}" style="min-height: 40px; padding: 0 14px; border-radius: 9px; border: none; background: {{ t.bg }}; color: {{ t.fg }}; font-weight: 500">{{ t.name }}</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<button class="hov" onClick="{{ toggleEnforce }}" aria-pressed="{{ enforceStr }}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #33436A; background: #0E172B">
<span style="width: 34px; height: 20px; border-radius: 10px; background: {{ enforceTrack }}; position: relative; display: inline-block"><span style="position: absolute; top: 2px; left: {{ enforceKnob }}; width: 16px; height: 16px; border-radius: 8px; background: #E6ECF5"></span></span>
{{ enforceLabel }}
</button>
<button class="pri" onClick="{{ saveFlow }}" style="min-height: 44px; padding: 0 18px; border-radius: 10px; border: none; background: #3B82F6; color: #FFFFFF; font-weight: 600">Lưu quy trình</button>
</div>
</div>

<section aria-label="Danh sách quy trình" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px">
<sc-for list="{{ flowItems }}" as="w" hint-placeholder-count="2">
<div style="border: 1px solid {{ w.border }}; background: {{ w.bg }}; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<button onClick="{{ w.pick }}" aria-pressed="{{ w.pressed }}" aria-label="{{ w.aria }}" style="border: none; background: transparent; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 4px; min-height: 44px">
<span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 16px">{{ w.name }}</span>
<sc-if value="{{ w.isDef }}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: #1D3A70; color: #DCE8FF">Mặc định</span></sc-if>
<sc-if value="{{ w.loose }}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: #3A2010; color: #FDBA8C">Không bắt buộc</span></sc-if>
</span>
<span style="font-size: 13px; color: #9AA8C1">{{ w.desc }}</span>
<span style="font-size: 12px; color: #C5D0E3">{{ w.meta }}</span>
</button>
<div style="display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px solid #1E2A47; padding-top: 10px">
<button class="hov" onClick="{{ w.edit }}" aria-label="{{ w.editAria }}" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #33436A; background: transparent; font-size: 12.5px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"></path></svg>Sửa</button>
<button class="hov" onClick="{{ w.dup }}" aria-label="{{ w.dupAria }}" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #33436A; background: transparent; font-size: 12.5px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 8h12v12H8zM4 16V4h12"></path></svg>Nhân bản</button>
<sc-if value="{{ w.notDef }}" hint-placeholder-val="{{ true }}"><button class="hov" onClick="{{ w.makeDef }}" style="min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #33436A; background: transparent; font-size: 12.5px">Đặt mặc định</button></sc-if>
<button class="hov" onClick="{{ w.del }}" aria-label="{{ w.delAria }}" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #5A2A2A; background: transparent; color: #FCA5A5; font-size: 12.5px; margin-left: auto"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>Xoá</button>
</div>
</div>
</sc-for>
<button class="hov" onClick="{{ newFlow }}" style="min-height: 150px; border-radius: 14px; border: 1px dashed #3A4B75; background: transparent; color: #C5D0E3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-weight: 500">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Tạo quy trình mới
</button>
</section>

<sc-if value="{{ dlgForm }}" hint-placeholder-val="{{ false }}">
<section aria-label="{{ dlgTitle }}" style="border: 1px solid #3B82F6; border-radius: 16px; background: #0E172B; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600">{{ dlgTitle }}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #C5D0E3">Tên quy trình
<input type="text" value="{{ draft.name }}" onInput="{{ setDraftName }}" placeholder="Sửa lỗi khẩn" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid {{ draftBorder }}; background: #080D1A"></input>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #C5D0E3">Mô tả ngắn
<input type="text" value="{{ draft.desc }}" onInput="{{ setDraftDesc }}" placeholder="Dùng khi nào, cho loại task nào" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #33436A; background: #080D1A"></input>
</label>
<sc-if value="{{ dlgIsNew }}" hint-placeholder-val="{{ true }}">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #C5D0E3">Bắt đầu từ
<select value="{{ draft.from }}" onChange="{{ setDraftFrom }}" style="min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid #33436A; background: #080D1A">
<sc-for list="{{ fromOpts }}" as="o" hint-placeholder-count="5"><option value="{{ o.id }}">{{ o.label }}</option></sc-for>
</select>
</label>
</sc-if>
</div>
<sc-if value="{{ draftErr }}" hint-placeholder-val="{{ false }}"><span role="alert" style="font-size: 13px; color: #FCA5A5">Nhập tên cho quy trình.</span></sc-if>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button class="pri" onClick="{{ submitDraft }}" style="min-height: 44px; padding: 0 18px; border-radius: 10px; border: none; background: #3B82F6; color: #FFFFFF; font-weight: 600">{{ dlgSubmit }}</button>
<button class="hov" onClick="{{ closeDlg }}" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #33436A; background: transparent">Huỷ</button>
</div>
</section>
</sc-if>

<sc-if value="{{ dlgDel }}" hint-placeholder-val="{{ false }}">
<section role="alertdialog" aria-label="Xác nhận xoá quy trình" style="border: 1px solid #7F2A2A; border-radius: 16px; background: #1A0F14; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600">{{ delTitle }}</h2>
<p style="margin: 0; color: #E8C4C4; font-size: 13.5px">{{ delNote }}</p>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-if value="{{ canDelFlow }}" hint-placeholder-val="{{ true }}"><button onClick="{{ confirmDel }}" style="min-height: 44px; padding: 0 18px; border-radius: 10px; border: none; background: #DC2626; color: #FFFFFF; font-weight: 600">Xoá quy trình</button></sc-if>
<button class="hov" onClick="{{ closeDlg }}" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #5A2A2A; background: transparent">{{ delCancel }}</button>
</div>
</section>
</sc-if>

<sc-if value="{{ flowSaved }}" hint-placeholder-val="{{ false }}">
<p role="status" style="margin: 0; padding: 10px 14px; border-radius: 10px; background: #123327; color: #9BEBC9; font-size: 13px">{{ flowMsg }}</p>
</sc-if>
<sc-if value="{{ notEnforced }}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 10px 14px; border-radius: 10px; background: #3A2010; color: #FDBA8C; font-size: 13px">Quy trình đang tắt: agent trong {{ deptName }} tự quyết thứ tự làm việc, nền tảng chỉ ghi log.</p>
</sc-if>

<section aria-label="Mẫu quy trình" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid #1E2A47; border-radius: 14px; background: #0E172B">
<span style="font-weight: 500">Bắt đầu từ mẫu</span>
<div role="group" aria-label="Chọn mẫu quy trình" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{ tplPills }}" as="m" hint-placeholder-count="3">
<button onClick="{{ m.pick }}" aria-pressed="{{ m.pressed }}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{ m.border }}; background: {{ m.bg }}; color: {{ m.fg }}; font-weight: 500">{{ m.label }}</button>
</sc-for>
</div>
<span style="color: #9AA8C1; font-size: 13px; flex: 1 1 240px">Chọn mẫu sẽ thay các bước hiện tại. Sửa tiếp từng bước bên dưới.</span>
</section>

<section aria-label="Các bước của quy trình" style="border: 1px solid #1E2A47; border-radius: 16px; background: #0E172B; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; padding: 14px 16px; border-bottom: 1px solid #1E2A47">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600">Các bước: {{ flowName }}</h2>
<span style="font-size: 13px; color: #9AA8C1">{{ flowCount }} bước · bấm một bước để sửa</span>
</div>
<div style="overflow-x: auto; padding: 20px 16px">
<ol style="list-style: none; margin: 0; padding: 0; display: flex; align-items: stretch; width: max-content">
<sc-for list="{{ flowSteps }}" as="f" hint-placeholder-count="6">
<li style="display: flex; align-items: center">
<button onClick="{{ f.pick }}" aria-label="{{ f.aria }}" aria-pressed="{{ f.pressed }}" style="width: 214px; min-height: 236px; box-sizing: border-box; padding: 14px; border-radius: 14px; border: 1px solid {{ f.border }}; background: {{ f.bg }}; display: flex; flex-direction: column; align-items: stretch; gap: 10px; text-align: left">
<span style="display: flex; align-items: center; gap: 10px">
<span style="width: 28px; height: 28px; border-radius: 14px; border: 1px solid #3A4B75; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px; flex: none">{{ f.num }}</span>
<span style="font-weight: 600; font-size: 14px; line-height: 1.3">{{ f.name }}</span>
</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 12.5px">
<span style="width: 26px; height: 26px; border-radius: 13px; background: {{ f.whoBg }}; color: {{ f.whoFg }}; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 10px; flex: none">{{ f.initials }}</span>
<span style="display: flex; flex-direction: column; line-height: 1.25"><span>{{ f.who }}</span><span style="font-size: 11.5px; color: #9AA8C1">{{ f.role }}</span></span>
</span>
<span style="align-self: flex-start; font-size: 11.5px; font-weight: 500; padding: 3px 9px; border-radius: 999px; background: {{ f.gateBg }}; color: {{ f.gateFg }}">{{ f.gate }}</span>
<span style="font-size: 12px; color: {{ f.failColor }}">{{ f.fail }}</span>
<span style="font-size: 12px; color: #9AA8C1; border-top: 1px solid #1E2A47; padding-top: 8px">Đầu ra: {{ f.out }}</span>
<sc-if value="{{ f.here }}" hint-placeholder-val="{{ false }}">
<span style="margin-top: auto; align-self: flex-start; display: flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: #1D3A70; color: #DCE8FF"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 3px; background: #60A5FA"></span>{{ f.hereLabel }}</span>
</sc-if>
</button>
<sc-if value="{{ f.notLast }}" hint-placeholder-val="{{ true }}">
<span aria-hidden="true" style="width: 40px; display: flex; align-items: center; justify-content: center; color: #5B6B92">
<svg width="28" height="14" viewBox="0 0 28 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7h25M20 2l6 5-6 5"></path></svg>
</span>
</sc-if>
</li>
</sc-for>
<li style="display: flex; align-items: center; padding-left: 16px">

<li style="display: flex; flex-direction: column; gap: 4px; padding: 9px 12px; border-top: 1px solid #16203A; background: {{ r.bg }}">
<span style="display: flex; align-items: center; gap: 10px; font-size: 13px"><span style="font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: #9AA8C1; width: 48px; flex: none">{{ r.id }}</span><span style="flex: 1; min-width: 0">{{ r.name }}</span><span style="font-size: 11.5px; padding: 2px 9px; border-radius: 999px; background: {{ r.stBg }}; color: {{ r.stFg }}; white-space: nowrap">{{ r.st }}</span></span>
<sc-if value="{{ r.isFail }}" hint-placeholder-val="{{ false }}"><span style="padding-left: 58px; font-size: 12.5px; color: #FCA5A5">{{ r.detail }}</span></sc-if>
</li>
</sc-for>
</ul>
</div>
</sc-if>

<sc-if value="{{ wt.data }}" hint-placeholder-val="{{ false }}">
<div style="overflow-x: auto; border: 1px solid #1E2A47; border-radius: 10px">
<table style="width: 100%; min-width: 560px; border-collapse: collapse; font-size: 13px">
<thead><tr style="text-align: left; color: #9AA8C1; font-size: 12px; background: #0B1324"><th style="padding: 10px 12px; font-weight: 500">Từ khoá</th><th style="padding: 10px 12px; font-weight: 500; text-align: right">Lượt tìm/tháng</th><th style="padding: 10px 12px; font-weight: 500">Độ khó</th><th style="padding: 10px 12px; font-weight: 500">Ý định</th></tr></thead>
<tbody><sc-for list="{{ dataRows }}" as="r" hint-placeholder-count="5"><tr style="border-top: 1px solid #16203A"><td style="padding: 9px 12px">{{ r.k }}</td><td style="padding: 9px 12px; text-align: right; font-variant-numeric: tabular-nums">{{ r.v }}</td><td style="padding: 9px 12px">{{ r.d }}</td><td style="padding: 9px 12px">{{ r.i }}</td></tr></sc-for></tbody>
</table>
</div>
</sc-if>

<sc-if value="{{ wt.plan }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<div style="flex: 3 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #9AA8C1">Việc đã giao xuống</span>
<sc-for list="{{ planRows }}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: #0B1324; border: 1px solid #1E2A47">
<span style="font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: #9AA8C1; width: 48px; flex: none">{{ r.id }}</span>
<span style="flex: 1; min-width: 0; font-size: 13px">{{ r.title }}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px"><span style="width: 24px; height: 24px; border-radius: 12px; background: {{ r.provBg }}; color: {{ r.provFg }}; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 10px">{{ r.initials }}</span>{{ r.who }}</span>
<span style="font-size: 11.5px; padding: 2px 9px; border-radius: 999px; background: {{ r.stBg }}; color: {{ r.stFg }}; white-space: nowrap">{{ r.st }}</span>
</div>
</sc-for>
</div>
<div style="flex: 2 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #9AA8C1">Quyết định gần đây</span>
<ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px"><sc-for list="{{ decisions }}" as="d" hint-placeholder-count="3"><li>{{ d }}</li></sc-for></ul>
</div>
</div>
</sc-if>

<sc-if value="{{ wt.chat }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<div style="flex: 3 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: #080D1A; border: 1px solid #1A2440">
<sc-for list="{{ chatV.msgs }}" as="m" hint-placeholder-count="3">
<div style="display: flex; justify-content: {{ m.align }}"><div style="max-width: 80%; padding: 10px 12px; border-radius: 12px; background: {{ m.bg }}; font-size: 13.5px"><span style="display: block; font-size: 11.5px; color: #9AA8C1; margin-bottom: 2px">{{ m.who }}</span>{{ m.text }}</div></div>
</sc-for>
<div style="display: flex; justify-content: flex-end"><div style="max-width: 80%; padding: 10px 12px; border-radius: 12px; border: 1px dashed #3B82F6; background: #0E1B36; font-size: 13.5px"><span style="display: block; font-size: 11.5px; color: #BFD8FF; margin-bottom: 2px">{{ chatV.draftLabel }}</span>{{ chatV.draft }}<sc-if value="{{ chatV.caret }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="color: #60A5FA">▍</span></sc-if></div></div>
</div>
<dl style="flex: 1 1 220px; margin: 0; display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 8px 10px; font-size: 13px; padding: 14px; border-radius: 12px; background: #0B1324; border: 1px solid #1E2A47">
<dt style="color: #9AA8C1">Ticket</dt><dd style="margin: 0">{{ chatV.id }}</dd>
<dt style="color: #9AA8C1">Khách</dt><dd style="margin: 0">{{ chatV.customer }}</dd>
<dt style="color: #9AA8C1">Chủ đề</dt><dd style="margin: 0">{{ chatV.subject }}</dd>
<dt style="color: #9AA8C1">SLA</dt><dd style="margin: 0; color: #FDBA8C">{{ chatV.sla }}</dd>
</dl>
</div>
</sc-if>

<sc-if value="{{ wt.idle }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; color: #9AA8C1">Agent này chưa nhận task nào. Giao task ở màn hình Task để xem nó làm việc tại đây.</p></sc-if>

</div>
</section>
</sc-if>

</div>
</main>
</div>
</script>
